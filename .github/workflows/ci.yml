name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  build:
    uses: devsecopslonghn/.github/.github/workflows/java-container.yml@master
    with:
      java_version: "21"
      build_command: mvn -B -ntp test
      image_name: ghcr.io/devsecopslonghn/fund-management-backend
      dockerfile: Dockerfile
      publish_image: true
    secrets: inherit

  update-gitops:
    needs: build
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Helm chart
        uses: actions/checkout@v4
        with:
          repository: devsecopslonghn/fund-management-helm-chart
          ref: master
          token: ${{ secrets.GITOPS_TOKEN }}
          path: chart

      - name: Update image reference
        working-directory: chart
        env:
          IMAGE_REPOSITORY: ghcr.io/devsecopslonghn/fund-management-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("values.yaml")
          text = path.read_text()
          match = re.search(r"(?ms)^backend:\n.*\Z", text)
          if not match:
              raise SystemExit("backend values block was not found")
          block = match.group(0)
          block, repo_count = re.subn(r"(?m)^    repository:.*$", f"    repository: {os.environ['IMAGE_REPOSITORY']}", block, count=1)
          block, tag_count = re.subn(r"(?m)^    tag:.*$", f"    tag: {os.environ['IMAGE_TAG']}", block, count=1)
          if repo_count != 1 or tag_count != 1:
              raise SystemExit("backend image reference was not updated exactly once")
          path.write_text(text[:match.start()] + block + text[match.end():])
          PY

      - name: Commit GitOps reference
        working-directory: chart
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add values.yaml
          git diff --cached --quiet || git commit -m "chore(gitops): deploy backend ${{ github.sha }} [skip ci]"
          git push origin master
