openapi: 3.0.3
info:
  title: Fund Management API
  version: 1.1.0
  description: |
    Phase 1 API for the single-group fund. Money values are integer VND. The
    approved public payment dashboard may expose member/month due details, but
    never returns contact data, OAuth material, credentials, or raw bank messages.
servers:
  - url: /api/v1
tags:
  - name: Public
  - name: Personal
  - name: Admin
paths:
  /public/overview:
    get:
      tags: [Public]
      operationId: getPublicOverview
      responses:
        '200':
          description: Aggregate fund status and non-sensitive member badges
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicOverview' } } }
  /public/payment-dashboard:
    get:
      tags: [Public]
      operationId: getPublicPaymentDashboard
      parameters: [{ name: year, in: query, required: false, schema: { type: integer, minimum: 2000, maximum: 9999 }, description: Calendar year for the 14-period contribution board (01..12 plus mandatory bonus periods 13 and 14). }]
      description: Public payment dashboard with member/month details approved for the current product policy. Never returns contact data, OAuth material, credentials, or raw bank messages.
      responses:
        '200':
          description: Detailed payment dashboard
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicPaymentDashboard' } } }
  /public/contribution-board:
    get:
      tags: [Public]
      operationId: getPublicContributionBoard
      parameters: [{ name: year, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 9999 } }]
      description: Lightweight year board. Due rows are projected to id, month, amount and status; contacts, OAuth and raw bank data are never returned.
      responses:
        '200':
          description: Year contribution board
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicPaymentDashboard' } } }
  /public/payment-options:
    get:
      tags: [Public]
      operationId: getPublicPaymentOptions
      parameters:
        - { name: fullName, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: memberCode, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z0-9_-]{2,32}$' } }
        - { name: year, in: query, required: false, schema: { type: integer, minimum: 2000, maximum: 9999 } }
      description: Indexed member lookup for the payer panel. Supply memberCode for a duplicate-name roster.
      responses:
        '200': { description: Payable periods only, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPaymentOptions' } } } }
  /public/payment-intents/{id}:
    get:
      tags: [Public]
      operationId: getPublicPaymentIntentStatus
      description: Polls only the opaque intent status; never returns payer identity, account, amount, or bank message data.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Payment intent status, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPaymentIntentStatus' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/payment-intents/{id}/details:
    get:
      tags: [Public]
      operationId: getPublicPaymentIntentDetails
      description: Returns shareable payment details only; excludes payer identity and internal transaction data.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Shareable payment details, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPaymentIntentDetails' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/personal-link-requests:
    post:
      tags: [Public]
      operationId: requestPersonalLink
      description: Always returns 202 and never discloses whether the email exists. Delivery is Phase 2.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PersonalLinkRequest' } } } }
      responses: { '202': { description: Generic accepted response, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } } }
  /me/{token}:
    get:
      tags: [Personal]
      operationId: getPersonalOverview
      parameters: [{ $ref: '#/components/parameters/MagicToken' }]
      responses:
        '200': { description: Personal dues overview, content: { application/json: { schema: { $ref: '#/components/schemas/PersonalOverview' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/{token}/payment-intents:
    post:
      tags: [Personal]
      operationId: createPaymentIntent
      parameters: [{ $ref: '#/components/parameters/MagicToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePaymentIntentRequest' } } } }
      responses:
        '201': { description: Durable pending payment intent, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentIntent' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /me/{token}/payment-intents/{intentId}:
    get:
      tags: [Personal]
      operationId: getPaymentIntent
      parameters: [{ $ref: '#/components/parameters/MagicToken' }, { name: intentId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Payment intent status, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentIntent' } } } }
  /admin/members:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: listMembers
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Admin member page, content: { application/json: { schema: { $ref: '#/components/schemas/MemberPage' } } } }
    post:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: createMember
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MemberUpsertRequest' } } } }
      responses:
        '201': { description: Member and one-time magic link, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedMember' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/members/{memberId}:
    put:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: updateMember
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MemberUpsertRequest' } } } }
      responses: { '200': { description: Updated member, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } } }
    delete:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: deactivateMember
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Member soft-deactivated } }
  /admin/members/{memberId}/magic-link:
    post:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: regenerateMagicLink
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: New one-time link value, content: { application/json: { schema: { $ref: '#/components/schemas/MagicLink' } } } } }
  /admin/payment-plans:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: listPaymentPlans
      parameters: [{ name: year, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 9999 } }]
      responses: { '200': { description: Annual master plan grid, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentPlanPage' } } } } }
  /admin/members/{memberId}/payment-plan:
    put:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: savePaymentPlan
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentPlanRequest' } } } }
      responses: { '200': { description: Audited idempotent master plan, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentPlan' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/dues/generate:
    post:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: generateDuePeriods
      parameters: [{ name: month, in: query, required: true, schema: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' } }]
      responses: { '200': { description: Idempotent generation result, content: { application/json: { schema: { $ref: '#/components/schemas/GenerationResult' } } } } }
  /admin/dues/generate-year:
    post:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: generateDuePeriodsForYear
      parameters: [{ name: year, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 9999 } }]
      responses: { '200': { description: Idempotent generation from member master plans, content: { application/json: { schema: { $ref: '#/components/schemas/YearGenerationResult' } } } } }
  /admin/dues:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: listDuePeriods
      parameters: [{ name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }, { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }, { name: month, in: query, schema: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' } }, { name: memberId, in: query, schema: { type: string } }]
      responses: { '200': { description: Paged admin due periods, content: { application/json: { schema: { $ref: '#/components/schemas/DuePeriodPage' } } } } }
  /admin/dues/{dueId}:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: getDuePeriod
      parameters: [{ name: dueId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Due period detail, content: { application/json: { schema: { $ref: '#/components/schemas/AdminDuePeriod' } } } } }
    put:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: adjustDuePeriod
      parameters: [{ name: dueId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DueAdjustmentRequest' } } } }
      responses: { '200': { description: Audited due adjustment, content: { application/json: { schema: { $ref: '#/components/schemas/AdminDuePeriod' } } } } }
  /admin/payments:
    post:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: recordManualPayment
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManualPaymentRequest' } } } }
      responses:
        '201': { description: FIFO allocation result, content: { application/json: { schema: { $ref: '#/components/schemas/ManualPayment' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/expenses:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: listExpenses
      parameters: [{ name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }, { name: category, in: query, schema: { type: string } }]
      responses: { '200': { description: Expenses, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Expense' } } } } } }
    post:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: createExpense
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpenseRequest' } } } }
      responses: { '201': { description: Expense, content: { application/json: { schema: { $ref: '#/components/schemas/Expense' } } } } }
  /admin/expenses/{expenseId}:
    put:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: updateExpense
      parameters: [{ name: expenseId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpenseRequest' } } } }
      responses: { '200': { description: Expense, content: { application/json: { schema: { $ref: '#/components/schemas/Expense' } } } } }
    delete:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: deleteExpense
      parameters: [{ name: expenseId, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Soft-deleted expense } }
  /admin/dashboard:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: getAdminDashboard
      responses: { '200': { description: Dashboard including private late-payer data, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } } }
  /admin/statistics:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: getStatistics
      responses: { '200': { description: Dashboard statistics, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } } }
  /admin/reports/expenses:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: getExpenseReport
      parameters: [{ name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }]
      responses: { '200': { description: Expense totals and category/month breakdown, content: { application/json: { schema: { $ref: '#/components/schemas/ExpenseReport' } } } } }
  /admin/reports/expenses/export:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: exportExpensesCsv
      responses: { '200': { description: UTF-8 CSV export, content: { text/csv: { schema: { type: string, format: binary } } } } }
  /admin/reports/export:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: exportFundSummaryCsv
      parameters: [{ name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }]
      responses: { '200': { description: UTF-8 monthly income/expense summary CSV, content: { text/csv: { schema: { type: string, format: binary } } } } }
  /admin/settings:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      description: Requires SUPER_ADMIN; response excludes secret values.
      operationId: getSettings
      responses: { '200': { description: Effective settings without secret values, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } } }
    put:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      description: Requires SUPER_ADMIN. smtpSecretRef is an external reference only.
      operationId: updateSettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SettingsRequest' } } } }
      responses: { '200': { description: Updated settings, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } } }
  /admin/ingestion/status:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: getIngestionStatus
      responses: { '200': { description: Feature and provider status, content: { application/json: { schema: { $ref: '#/components/schemas/IngestionStatus' } } } } }
  /admin/gmail/oauth/start:
    post:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: startGmailOAuth
      description: SUPER_ADMIN only. Starts short-lived one-time state authorization with Gmail readonly scope and PKCE S256.
      responses: { '200': { description: Authorization URL, content: { application/json: { schema: { $ref: '#/components/schemas/GmailOAuthStart' } } } } }
  /admin/gmail/oauth/callback:
    get:
      tags: [Admin]
      operationId: completeGmailOAuth
      description: Public browser redirect target; state is cryptographically random, hashed, short-lived, and atomically consumed once. On completion the server returns 302 to the configured frontend origin with generic gmailOAuth=connected|failed.
      parameters: [{ name: state, in: query, required: false, schema: { type: string } }, { name: code, in: query, required: false, schema: { type: string } }, { name: error, in: query, required: false, schema: { type: string } }]
      responses: { '302': { description: Generic frontend redirect, headers: { Location: { schema: { type: string, format: uri } } } } }
  /admin/integrations/gmail/oauth/callback:
    get:
      tags: [Admin]
      operationId: completeGmailOAuthRegisteredRedirect
      description: Compatibility callback for the registered Google web-client URI. Same one-time state validation and generic 302 frontend redirect as the canonical callback.
      parameters: [{ name: state, in: query, required: false, schema: { type: string } }, { name: code, in: query, required: false, schema: { type: string } }, { name: error, in: query, required: false, schema: { type: string } }]
      responses: { '302': { description: Generic frontend redirect, headers: { Location: { schema: { type: string, format: uri } } } } }
  /admin/gmail/oauth/status:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: getGmailOAuthStatus
      responses: { '200': { description: Connection status without tokens, content: { application/json: { schema: { $ref: '#/components/schemas/GmailOAuthStatus' } } } } }
  /admin/gmail/oauth/disconnect:
    post:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: disconnectGmailOAuth
      responses: { '204': { description: Encrypted credential removed } }
  /admin/reconciliation/ingest:
    post:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: ingestBankMessage
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BankTransactionIngestionRequest' } } } }
      responses: { '201': { description: Idempotent bank ledger record, content: { application/json: { schema: { $ref: '#/components/schemas/BankTransaction' } } } } }
  /admin/reconciliation/review:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: listReconciliationReviewQueue
      parameters: [{ name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }, { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }]
      responses: { '200': { description: Ranked manual review queue, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationPage' } } } } }
  /admin/reconciliation/{transactionId}/review:
    post:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: reviewBankTransaction
      parameters: [{ name: transactionId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationReviewRequest' } } } }
      responses: { '200': { description: Audited reconciliation result, content: { application/json: { schema: { $ref: '#/components/schemas/BankTransaction' } } } } }
  /admin/audit-logs:
    get:
      tags: [Admin]
      security: [{ basicAuth: [] }]
      operationId: listAuditLogs
      parameters: [{ name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }, { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }, { name: entityType, in: query, schema: { type: string } }]
      responses: { '200': { description: Immutable financial audit events, content: { application/json: { schema: { $ref: '#/components/schemas/AuditLogPage' } } } } }
components:
  securitySchemes: { basicAuth: { type: http, scheme: basic } }
  parameters:
    MagicToken: { name: token, in: path, required: true, schema: { type: string, minLength: 32 }, description: Non-guessable bearer-like link value; never log or persist client-side. }
  responses:
    ValidationError: { description: Invalid request }
    Conflict: { description: Unique/business-key conflict }
    NotFound: { description: Resource not found }
  schemas:
    PublicOverview: { type: object, required: [balance, members], properties: { balance: { type: integer, format: int64, description: Aggregate VND only }, incomeThisMonth: { type: integer, format: int64 }, expenseThisMonth: { type: integer, format: int64 }, members: { type: array, items: { $ref: '#/components/schemas/PublicMemberStatus' } } } }
    PublicMemberStatus: { type: object, properties: { name: { type: string }, status: { type: string, enum: [NO_DUE_PERIODS, UP_TO_DATE, SOME_MONTHS_MISSING, OVERDUE] } } }
    PublicPaymentDashboard: { type: object, properties: { balance: { type: integer, format: int64 }, incomeThisMonth: { type: integer, format: int64 }, expenseThisMonth: { type: integer, format: int64 }, monthlySeries: { type: array, items: { $ref: '#/components/schemas/MonthlySeries' } }, year: { type: integer, nullable: true }, months: { type: array, items: { type: string } }, members: { type: array, items: { $ref: '#/components/schemas/PublicPaymentDashboardMember' } } } }
    PublicPaymentDashboardMember: { type: object, properties: { id: { type: string }, fullName: { type: string }, memberCode: { type: string }, joinMonth: { type: string }, baselineMonth: { type: string }, contributionAmount: { type: integer, format: int64 }, status: { type: string }, duePeriods: { type: array, items: { $ref: '#/components/schemas/PublicPaymentDashboardDue' } } } }
    PublicPaymentDashboardDue: { type: object, properties: { id: { type: string, nullable: true }, month: { type: string, description: YYYY-01..YYYY-14; 13 and 14 are bonus periods }, amountDue: { type: integer, format: int64 }, amountPaid: { type: integer, format: int64 }, outstandingAmount: { type: integer, format: int64 }, status: { type: string, nullable: true, enum: [UNPAID, PARTIAL, PAID, OVERPAID] }, displayStatus: { type: string, enum: [NOT_OPENED, UNPAID, PARTIAL, PAID, OVERPAID] } } }
    PublicPaymentOptions: { type: object, properties: { requiresMemberCode: { type: boolean }, matches: { type: array, items: { $ref: '#/components/schemas/PublicMemberMatch' } }, duePeriods: { type: array, items: { $ref: '#/components/schemas/PublicDuePeriod' } } } }
    PublicMemberMatch: { type: object, properties: { fullName: { type: string }, memberCode: { type: string, nullable: true } } }
    PublicDuePeriod: { type: object, properties: { id: { type: string }, month: { type: string }, outstandingAmount: { type: integer, format: int64 } } }
    PersonalOverview: { type: object, properties: { member: { $ref: '#/components/schemas/PersonalMember' }, totalPaid: { type: integer, format: int64 }, totalOwed: { type: integer, format: int64 }, duePeriods: { type: array, items: { $ref: '#/components/schemas/DuePeriod' } } } }
    PersonalMember: { type: object, properties: { id: { type: string }, fullName: { type: string }, memberCode: { type: string } } }
    DuePeriod: { type: object, properties: { id: { type: string }, month: { type: string }, amountDue: { type: integer, format: int64 }, amountPaid: { type: integer, format: int64 }, status: { type: string, enum: [UNPAID, PARTIAL, PAID, OVERPAID] }, notes: { type: string, nullable: true } } }
    CreatePaymentIntentRequest: { type: object, properties: { duePeriodIds: { type: array, items: { type: string } }, selectionMode: { type: string, enum: [EXPLICIT, ALL_OUTSTANDING, MONTH_COUNT, THROUGH_MONTH] }, monthCount: { type: integer, minimum: 1, maximum: 120 }, throughMonth: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' } } }
    PaymentIntent: { type: object, properties: { id: { type: string }, amount: { type: integer, format: int64 }, transferContent: { type: string }, qrImageUrl: { type: string, format: uri }, accountHolder: { type: string }, accountNumber: { type: string }, bankName: { type: string }, expiresAt: { type: string, format: date-time }, status: { type: string, enum: [PENDING, PARTIAL, FULFILLED, CREDIT, EXPIRED] } } }
    PublicPaymentIntentStatus: { type: object, properties: { id: { type: string }, status: { type: string, enum: [PENDING, PARTIAL, FULFILLED, CREDIT, EXPIRED] }, expiresAt: { type: string, format: date-time } } }
    PublicPaymentIntentDetails: { type: object, properties: { id: { type: string }, amount: { type: integer, format: int64 }, transferContent: { type: string }, qrImageUrl: { type: string, format: uri }, accountHolder: { type: string }, accountNumber: { type: string }, bankName: { type: string }, expiresAt: { type: string, format: date-time }, status: { type: string, enum: [PENDING, FULFILLED, EXPIRED] } } }
    MemberUpsertRequest: { type: object, required: [memberCode, fullName, email, joinMonth, contributionAmount], properties: { memberCode: { type: string, pattern: '^[A-Za-z0-9_-]{2,32}$' }, fullName: { type: string }, email: { type: string, format: email }, phone: { type: string }, joinMonth: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' }, baselineMonth: { type: string, nullable: true }, contributionAmount: { type: integer, format: int64, minimum: 1 }, status: { type: string, enum: [ACTIVE, PAUSED, LEFT] }, contributionStartMonth: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' }, annualContributionMonths: { type: integer, minimum: 1, maximum: 14 }, initiallyPaidMonths: { type: array, items: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-4])$' } } } }
