{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fund-management-backups
  labels:
    {{- include "fund-management-backend.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.backup.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.backup.storageSize }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fund-management-mongodb-backup
  labels:
    {{- include "fund-management-backend.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fund-management
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: {{ .Values.imagePullSecret }}
          securityContext:
            seccompProfile: {type: RuntimeDefault}
            fsGroup: 999
          containers:
            - name: mongodump
              image: {{ .Values.backup.image | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - >-
                  archive="/backups/fund-management-$(date -u +%Y%m%dT%H%M%SZ).archive.gz";
                  mongodump --uri="$MONGODB_URI" --db="$MONGODB_DATABASE" --archive="$archive" --gzip;
                  find /backups -type f -name 'fund-management-*.archive.gz' -mtime +{{ .Values.backup.retentionDays }} -delete
              envFrom:
                - secretRef: {name: {{ .Values.runtimeSecret }}}
              env:
                - {name: MONGODB_DATABASE, value: fund_management}
              volumeMounts:
                - {name: backups, mountPath: /backups}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: fund-management-backups}
{{- end }}
