{{- if .Values.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fund-management-backend
  labels:
    {{- include "fund-management-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fund-management
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fund-management
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: {name: {{ .Values.runtimeSecret }}}
            - secretRef: {name: {{ .Values.adminSecret }}}
          env:
            - {name: MONGODB_DATABASE, value: fund_management}
            - {name: APP_ALLOWED_ORIGINS, value: https://quybpdev.apps.drgdevlab.com}
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: fund-management-backend
  labels:
    {{- include "fund-management-backend.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: fund-management
    app.kubernetes.io/component: backend
  ports:
    - {name: http, port: 8080, targetPort: http}
