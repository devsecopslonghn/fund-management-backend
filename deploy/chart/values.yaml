# The deployment is intentionally omitted until the CI/CD pipeline publishes
# an immutable image tag into this application repository.
image:
  repository: nexus.apps.drgdevlab.com/fund-management/backend
  tag: 2878594f0f85
  pullPolicy: IfNotPresent

imagePullSecret: nexus-registry
runtimeSecret: fund-management-runtime
adminSecret: fund-management-admin
replicas: 1
scheduling:
  # Temporary availability guard: this node is verified to reach the managed
  # MongoDB cluster over DNS/TLS. Remove after egress is repaired cluster-wide.
  nodeSelector:
    kubernetes.io/hostname: eztechvn2
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 768Mi}
