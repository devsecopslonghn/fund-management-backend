spring:
  application:
    name: fund-management-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/fund_management}
      database: ${MONGODB_DATABASE:fund_management}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  level:
    # The Mongo driver logs connection metadata, including account identifiers,
    # at INFO. Keep that operational detail out of application logs.
    org.mongodb.driver: WARN
app:
  security:
    admin-username: ${APP_ADMIN_USERNAME:}
    admin-password: ${APP_ADMIN_PASSWORD:}
    super-admin-username: ${APP_SUPER_ADMIN_USERNAME:}
    super-admin-password: ${APP_SUPER_ADMIN_PASSWORD:}
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  fund:
    bank-name: ${FUND_BANK_NAME:Development Bank}
    bank-code: ${FUND_BANK_CODE:970422}
    account-number: ${FUND_ACCOUNT_NUMBER:0000000000}
    account-holder: ${FUND_ACCOUNT_HOLDER:QUY PHAT TRIEN LOCAL}
    payment-intent-minutes: ${FUND_PAYMENT_INTENT_MINUTES:30}
    default-contribution-amount: ${FUND_DEFAULT_CONTRIBUTION_AMOUNT:100000}
    auto-reconciliation-threshold: ${FUND_AUTO_RECONCILIATION_THRESHOLD:0.85}
    due-scheduler-enabled: ${FUND_DUE_SCHEDULER_ENABLED:false}
    startup-catch-up-enabled: ${FUND_STARTUP_CATCH_UP_ENABLED:false}
    ingestion-enabled: ${FUND_INGESTION_ENABLED:false}
    gmail-enabled: ${FUND_GMAIL_ENABLED:false}
    gmail-sender-filter: ${FUND_GMAIL_SENDER_FILTER:info@sacombank.com.vn}
    smtp-enabled: ${FUND_SMTP_ENABLED:false}
    smtp-host: ${FUND_SMTP_HOST:}
    smtp-port: ${FUND_SMTP_PORT:587}
    smtp-from: ${FUND_SMTP_FROM:}
    smtp-secret-ref: ${FUND_SMTP_SECRET_REF:}
  dues:
    scheduler-enabled: ${FUND_DUE_SCHEDULER_ENABLED:false}
    startup-catch-up-enabled: ${FUND_STARTUP_CATCH_UP_ENABLED:false}
  migration:
    apply-enabled: ${FUND_LEGACY_MIGRATION_APPLY_ENABLED:false}
  gmail:
    enabled: ${FUND_GMAIL_ENABLED:false}
    polling-enabled: ${FUND_GMAIL_POLLING_ENABLED:false}
    client-id: ${FUND_GMAIL_OAUTH_CLIENT_ID:}
    client-secret: ${FUND_GMAIL_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${FUND_GMAIL_OAUTH_REDIRECT_URI:}
    token-encryption-key: ${FUND_GMAIL_TOKEN_ENCRYPTION_KEY:}
    monitored-mailbox: ${FUND_GMAIL_MONITORED_ADDRESS:}
    sender-filter: ${FUND_GMAIL_SENDER_FILTER:info@sacombank.com.vn}
    state-ttl-seconds: ${FUND_GMAIL_OAUTH_STATE_TTL_SECONDS:600}
    lease-duration-seconds: ${FUND_GMAIL_POLL_LEASE_SECONDS:900}
    intent-match-seconds: ${FUND_GMAIL_INTENT_MATCH_SECONDS:300}
    fast-poll-interval-ms: ${FUND_GMAIL_FAST_POLL_INTERVAL_MS:5000}
    authorize-endpoint: ${FUND_GMAIL_OAUTH_AUTHORIZE_ENDPOINT:https://accounts.google.com/o/oauth2/v2/auth}
    token-endpoint: ${FUND_GMAIL_OAUTH_TOKEN_ENDPOINT:https://oauth2.googleapis.com/token}
    api-base-url: ${FUND_GMAIL_API_BASE_URL:https://gmail.googleapis.com/gmail/v1}
